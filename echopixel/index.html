<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050709">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EchoPixel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<title>EchoPixel</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#050709;color:#e8fff5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;min-height:100%}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}header{width:100%;padding:max(16px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:end;justify-content:space-between}.brand{font-size:28px;font-weight:850;letter-spacing:-1.2px}.sub{font-size:12px;color:#8ca399;margin-top:2px}.badge{font-size:12px;padding:6px 9px;border:1px solid #2b473b;border-radius:999px;color:#9fe3bd}#mapWrap{position:relative;width:min(94vw,640px);aspect-ratio:1;margin:2px auto 8px}canvas{width:100%;height:100%;border-radius:22px;background:#040807;border:1px solid #173127;box-shadow:0 0 40px rgba(0,255,130,.08) inset}#heading{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-variant-numeric:tabular-nums;color:#a8ffd0;font-size:14px;background:#06110dce;padding:6px 9px;border-radius:10px;border:1px solid #173127}#status{width:min(94vw,640px);min-height:54px;border:1px solid #173127;border-radius:14px;padding:10px 12px;color:#abc4b7;font-size:13px;line-height:1.35;background:#07100d}.controls{width:min(94vw,640px);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}button{appearance:none;border:0;border-radius:16px;min-height:58px;font-size:16px;font-weight:850}#start{background:#31e787;color:#00160b}#clear{background:#122019;color:#b7d4c3;border:1px solid #294637}button:disabled{opacity:.45}.note{width:min(94vw,640px);color:#6f877b;font-size:11px;text-align:center;margin-top:-3px;padding:0 8px 14px}
</style>
</head>
<body>
<header><div><div class="brand">EchoPixel</div><div class="sub">Acoustic surroundings mapper</div></div><div class="badge" id="mode">READY</div></header>
<div id="mapWrap"><canvas id="map" width="900" height="900"></canvas><div id="heading">0°</div></div>
<div id="status">Hold the iPhone upright. Tap START SCAN, allow microphone and motion access, then slowly turn through 360°.</div>
<div class="controls"><button id="start">START SCAN</button><button id="clear">CLEAR MAP</button></div>
<div class="note">Experimental sonar-style visualisation. Results are approximate and depend heavily on room acoustics and iPhone audio processing.</div>
<script>
(()=>{const cvs=document.getElementById('map'),ctx=cvs.getContext('2d');const startBtn=document.getElementById('start'),clearBtn=document.getElementById('clear');const statusEl=document.getElementById('status'),headingEl=document.getElementById('heading'),modeEl=document.getElementById('mode');let audioCtx,analyser,micSource,stream,scanning=false,heading=0,pingTimer=null,readings=[],noiseFloor=.015;const maxRange=5,speedSound=343,W=cvs.width,H=cvs.height,CX=W/2,CY=H/2,R=W*.43;function drawGrid(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#040807";ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(CX,CY);ctx.strokeStyle="#15352a";ctx.lineWidth=2;for(let i=1;i<=5;i++){ctx.beginPath();ctx.arc(0,0,R*i/5,0,Math.PI*2);ctx.stroke()}for(let a=0;a<360;a+=30){let t=a*Math.PI/180;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(t)*R,-Math.cos(t)*R);ctx.stroke()}ctx.fillStyle="#6e927f";ctx.font="24px -apple-system";ctx.textAlign="center";for(let i=1;i<=5;i++)ctx.fillText(i+"m",0,-R*i/5+28);ctx.restore();drawReadings()}function drawReadings(){ctx.save();ctx.translate(CX,CY);for(const p of readings){const t=p.a*Math.PI/180,rr=(p.d/maxRange)*R,x=Math.sin(t)*rr,y=-Math.cos(t)*rr,s=8+Math.min(24,p.strength*220),alpha=Math.min(.95,.22+p.strength*6);ctx.fillStyle=`rgba(52,255,141,${alpha})`;ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),s,s)}const t=heading*Math.PI/180;ctx.strokeStyle="#9effc8";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(t)*R*.95,-Math.cos(t)*R*.95);ctx.stroke();ctx.fillStyle="#d4ffe6";ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.restore()}function setHeading(v){heading=(v+360)%360;headingEl.textContent=Math.round(heading)+"°";drawGrid()}async function requestMotion(){try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){return(await DeviceOrientationEvent.requestPermission())==="granted"}return true}catch(e){return false}}window.addEventListener("deviceorientation",e=>{let h=null;if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;else if(typeof e.alpha==="number")h=360-e.alpha;if(h!==null)setHeading(h)},true);async function setupAudio(){audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});await audioCtx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.05;micSource=audioCtx.createMediaStreamSource(stream);micSource.connect(analyser)}function rmsNow(){const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);let s=0;for(const x of data)s+=x*x;return Math.sqrt(s/data.length)}function chirp(){if(!scanning||!audioCtx)return;const t=audioCtx.currentTime+.015,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.setValueAtTime(3500,t);osc.frequency.exponentialRampToValueAtTime(8500,t+.014);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.18,t+.002);gain.gain.exponentialRampToValueAtTime(.0001,t+.017);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.02);sampleEcho()}function sampleEcho(){const samples=[];let n=0,step=8;function take(){if(!scanning)return;samples.push(rmsNow());n++;if(n<46)setTimeout(take,step);else processEcho(samples,step)}setTimeout(take,10)}function processEcho(samples,stepMs){const tail=samples.slice(30),base=tail.reduce((a,b)=>a+b,0)/Math.max(1,tail.length);noiseFloor=noiseFloor*.85+base*.15;let peaks=[];for(let i=3;i<samples.length;i++){const v=samples[i];if(v>Math.max(noiseFloor*1.7,.025)&&v>samples[i-1]&&v>=samples[Math.min(samples.length-1,i+1)]){const elapsed=(10+i*stepMs)/1000,d=elapsed*speedSound/2;if(d>.25&&d<=maxRange)peaks.push({d,strength:Math.min(.3,v)})}}if(peaks.length){peaks.sort((a,b)=>b.strength-a.strength);const p=peaks[0];readings.push({a:heading,d:p.d,strength:p.strength});if(readings.length>1800)readings.splice(0,200);statusEl.textContent=`Echo at about ${p.d.toFixed(1)} m, heading ${Math.round(heading)}°. Keep turning slowly.`}else statusEl.textContent=`No strong reflection at ${Math.round(heading)}°. Keep turning slowly.`;drawGrid()}async function start(){if(scanning){stop();return}try{startBtn.disabled=true;const motionOK=await requestMotion();await setupAudio();scanning=true;modeEl.textContent="SCANNING";startBtn.textContent="STOP SCAN";startBtn.disabled=false;statusEl.textContent=motionOK?"Scanning. Slowly rotate the phone through 360°.":"Scanning. Motion permission was unavailable, so direction may be limited.";pingTimer=setInterval(chirp,650);chirp()}catch(e){startBtn.disabled=false;statusEl.textContent="Could not start. In iPhone Settings, allow Safari microphone and motion access, then reload this page.";modeEl.textContent="BLOCKED"}}function stop(){scanning=false;clearInterval(pingTimer);pingTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();modeEl.textContent="PAUSED";startBtn.textContent="START SCAN";statusEl.textContent="Scan paused. Your map is kept on screen."}startBtn.addEventListener("click",start);clearBtn.addEventListener("click",()=>{readings=[];drawGrid();statusEl.textContent="Map cleared. Tap START SCAN to begin again."});drawGrid();if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}})();
</script>
</body></html>
