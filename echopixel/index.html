<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050709">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EchoPixel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<title>EchoPixel</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#050709;color:#e8fff5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;min-height:100%}body{min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}header{width:100%;padding:max(16px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:end;justify-content:space-between}.brand{font-size:28px;font-weight:850;letter-spacing:-1.2px}.sub{font-size:12px;color:#8ca399;margin-top:2px}.badge{font-size:12px;padding:6px 9px;border:1px solid #2b473b;border-radius:999px;color:#9fe3bd}#mapWrap{position:relative;width:min(94vw,640px);aspect-ratio:1;margin:2px auto 8px}canvas{width:100%;height:100%;border-radius:22px;background:#040807;border:1px solid #173127;box-shadow:0 0 40px rgba(0,255,130,.08) inset}#heading{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-variant-numeric:tabular-nums;color:#a8ffd0;font-size:14px;background:#06110dce;padding:6px 9px;border-radius:10px;border:1px solid #173127}#status{width:min(94vw,640px);min-height:54px;border:1px solid #173127;border-radius:14px;padding:10px 12px;color:#abc4b7;font-size:13px;line-height:1.35;background:#07100d}.controls{width:min(94vw,640px);display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px;padding-bottom:0}button{appearance:none;border:0;border-radius:16px;min-height:58px;font-size:16px;font-weight:850}#start{background:#31e787;color:#00160b}#clear{background:#122019;color:#b7d4c3;border:1px solid #294637}button:disabled{opacity:.45}.sensitivity{width:min(94vw,640px);display:flex;align-items:center;gap:10px;padding:8px 4px 12px;color:#9bb0a5;font-size:12px}.sensitivity input{flex:1}.note{width:min(94vw,640px);color:#6f877b;font-size:11px;text-align:center;margin-top:-3px;padding:0 8px max(14px,env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header><div><div class="brand">EchoPixel</div><div class="sub">Acoustic surroundings mapper</div></div><div class="badge" id="mode">READY</div></header>
<div id="mapWrap"><canvas id="map" width="900" height="900"></canvas><div id="heading">0°</div></div>
<div id="status">Turn your iPhone volume right up. Hold it upright, tap START SCAN, then slowly turn through 360°.</div>
<div class="controls"><button id="start">START SCAN</button><button id="clear">CLEAR MAP</button></div>
<div class="sensitivity"><span>Sensitivity</span><input id="sens" type="range" min="1" max="5" step="1" value="4"><span id="sensLabel">High</span></div>
<div class="note">Experimental sonar-style visualisation. Results are approximate and depend heavily on room acoustics and iPhone audio processing.</div>
<script>
(()=>{const cvs=document.getElementById('map'),ctx=cvs.getContext('2d');const startBtn=document.getElementById('start'),clearBtn=document.getElementById('clear');const statusEl=document.getElementById('status'),headingEl=document.getElementById('heading'),modeEl=document.getElementById('mode'),sensEl=document.getElementById('sens'),sensLabel=document.getElementById('sensLabel');let audioCtx,analyser,micSource,stream,scanning=false,heading=0,pingTimer=null,readings=[],noiseFloor=.008;const maxRange=5,speedSound=343,W=cvs.width,H=cvs.height,CX=W/2,CY=H/2,R=W*.43;
function sensitivity(){return Number(sensEl.value)}
function threshold(){const s=sensitivity();return {mult:[0,1.9,1.65,1.42,1.24,1.10][s],floor:[0,.030,.024,.019,.014,.010][s]}}
sensEl.addEventListener('input',()=>{sensLabel.textContent=['','Low','Medium','Medium+','High','Very High'][sensitivity()]})
function drawGrid(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#040807";ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(CX,CY);ctx.strokeStyle="#15352a";ctx.lineWidth=2;for(let i=1;i<=5;i++){ctx.beginPath();ctx.arc(0,0,R*i/5,0,Math.PI*2);ctx.stroke()}for(let a=0;a<360;a+=30){let t=a*Math.PI/180;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(t)*R,-Math.cos(t)*R);ctx.stroke()}ctx.fillStyle="#6e927f";ctx.font="24px -apple-system";ctx.textAlign="center";for(let i=1;i<=5;i++)ctx.fillText(i+"m",0,-R*i/5+28);ctx.restore();drawReadings()}
function drawReadings(){ctx.save();ctx.translate(CX,CY);for(const p of readings){const t=p.a*Math.PI/180,rr=(p.d/maxRange)*R,x=Math.sin(t)*rr,y=-Math.cos(t)*rr,s=10+Math.min(30,p.strength*260),alpha=Math.min(.98,.30+p.strength*8);ctx.fillStyle=`rgba(52,255,141,${alpha})`;ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),s,s)}const t=heading*Math.PI/180;ctx.strokeStyle="#9effc8";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.sin(t)*R*.95,-Math.cos(t)*R*.95);ctx.stroke();ctx.fillStyle="#d4ffe6";ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.restore()}
function setHeading(v){heading=(v+360)%360;headingEl.textContent=Math.round(heading)+"°";drawGrid()}
async function requestMotion(){try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){return(await DeviceOrientationEvent.requestPermission())==="granted"}return true}catch(e){return false}}
window.addEventListener("deviceorientation",e=>{let h=null;if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;else if(typeof e.alpha==="number")h=360-e.alpha;if(h!==null)setHeading(h)},true);
async function setupAudio(){audioCtx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});await audioCtx.resume();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.01;micSource=audioCtx.createMediaStreamSource(stream);micSource.connect(analyser)}
function rmsNow(){const data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);let s=0;for(const x of data)s+=x*x;return Math.sqrt(s/data.length)}
function oneChirp(offset=0){const t=audioCtx.currentTime+.02+offset,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="square";osc.frequency.setValueAtTime(1800,t);osc.frequency.exponentialRampToValueAtTime(6200,t+.028);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.82,t+.003);gain.gain.setValueAtTime(.82,t+.020);gain.gain.exponentialRampToValueAtTime(.0001,t+.032);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.035)}
function chirp(){if(!scanning||!audioCtx)return;oneChirp(0);oneChirp(.055);sampleEcho()}
function sampleEcho(){const samples=[];let n=0,step=4;function take(){if(!scanning)return;samples.push(rmsNow());n++;if(n<42)setTimeout(take,step);else processEcho(samples,step)}setTimeout(take,18)}
function processEcho(samples,stepMs){const tail=samples.slice(28),base=tail.reduce((a,b)=>a+b,0)/Math.max(1,tail.length);noiseFloor=noiseFloor*.82+base*.18;const th=threshold();let peaks=[];for(let i=5;i<samples.length;i++){const v=samples[i];if(v>Math.max(noiseFloor*th.mult,th.floor)&&v>=samples[i-1]&&v>=samples[Math.min(samples.length-1,i+1)]){const elapsed=(18+i*stepMs)/1000,d=elapsed*speedSound/2;if(d>.35&&d<=maxRange)peaks.push({d,strength:Math.min(.35,v)})}}if(peaks.length){peaks.sort((a,b)=>b.strength-a.strength);const p=peaks[0];readings.push({a:heading,d:p.d,strength:p.strength});if(readings.length>1800)readings.splice(0,200);statusEl.textContent=`Reflection detected about ${p.d.toFixed(1)} m away at ${Math.round(heading)}°. Keep turning slowly.`}else{statusEl.textContent=`No strong reflection at ${Math.round(heading)}°. If the map stays blank, move Sensitivity to Very High.`}drawGrid()}
async function start(){if(scanning){stop();return}try{startBtn.disabled=true;const motionOK=await requestMotion();await setupAudio();scanning=true;modeEl.textContent="SCANNING";startBtn.textContent="STOP SCAN";startBtn.disabled=false;statusEl.textContent=motionOK?"LOUD scan running. Slowly rotate through 360°. Keep the iPhone volume high.":"Scanning. Motion permission was unavailable, so direction may be limited.";pingTimer=setInterval(chirp,520);chirp()}catch(e){startBtn.disabled=false;statusEl.textContent="Could not start. Allow Safari microphone and motion access, then reload this page.";modeEl.textContent="BLOCKED"}}
function stop(){scanning=false;clearInterval(pingTimer);pingTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());if(audioCtx)audioCtx.close();modeEl.textContent="PAUSED";startBtn.textContent="START SCAN";statusEl.textContent="Scan paused. Your map is kept on screen."}
startBtn.addEventListener("click",start);clearBtn.addEventListener("click",()=>{readings=[];drawGrid();statusEl.textContent="Map cleared. Tap START SCAN to begin again."});drawGrid();if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}})();
</script>
</body></html>
